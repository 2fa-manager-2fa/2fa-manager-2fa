<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحسابات الشاملة | 2FA Manager</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        /* المتغيرات الأساسية */
        :root {
            --bg-main: #090b14; --panel-bg: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; --text-muted: #8b9bb4; --primary: #00f0ff; --secondary: #7000ff;
            --success: #00ff88; --warning: #ffaa00; --danger: #ff3366; --btn-text: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.3); --shadow: rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; align-items: center; padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        .glass-panel { background: var(--panel-bg); border: 1px solid var(--border); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px var(--shadow); margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: var(--btn-text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        textarea, input { width: 100%; padding: 10px; background: rgba(128,128,128,0.1); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; margin-top: 8px; }
        /* تصميم البطاقات المتبقي كما هو */
        .accounts-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .account-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول الجديد -->
    <div class="container" id="login-section" style="margin-top: 50px;">
        <div class="glass-panel">
            <h2 style="text-align:center; color:var(--primary); margin-bottom: 20px;">تسجيل الدخول للإدارة</h2>
            <button class="btn" style="background:#db4437" onclick="loginWithGoogle()">تسجيل الدخول باستخدام جوجل</button>
            <input type="email" id="emailField" placeholder="الإيميل">
            <input type="password" id="passField" placeholder="الباسورد">
            <button class="btn" onclick="loginWithEmail()">دخول بريد / باسورد</button>
        </div>
    </div>

    <!-- المحتوى الأصلي الخاص بك -->
    <div class="container" id="app-section" style="display:none;">
        <div class="top-nav" style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--primary);">2FA Session</h2>
            <button class="btn-danger" onclick="firebase.auth().signOut()">تسجيل خروج</button>
        </div>
        
        <div class="glass-panel">
            <div class="section-label" style="color:var(--primary); font-weight:bold;">إضافة الحسابات</div>
            <textarea id="bulkInput" placeholder="الترتيب: جيميل، باسورد، استرداد، سنة، مفتاح، رموز..."></textarea>
            <button class="btn" onclick="importAccounts()">إضافة الحسابات</button>
        </div>

        <div class="glass-panel">
            <div class="section-label" style="display:flex; justify-content:space-between;">
                <span>الحسابات الحالية (<span id="stats">0</span>)</span>
            </div>
            <div class="accounts-grid" id="cardsContainer"></div>
        </div>
    </div>

    <script>
        // إعدادات فايبربيس
        const firebaseConfig = {
            apiKey: "AIzaSyAwwVvGPCVkR5ekWN7XGs2hwGTQ0eP4Am8",
            authDomain: "fa-manager-59615.firebaseapp.com",
            projectId: "fa-manager-59615",
            storageBucket: "fa-manager-59615.appspot.com",
            messagingSenderId: "38616686936",
            appId: "1:38616686936:web:922eb72e3c1d74a094852d"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // منطق تسجيل الدخول
        function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function loginWithEmail() {
            let e = document.getElementById('emailField').value;
            let p = document.getElementById('passField').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        // مراقبة الدخول
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('app-section').style.display = 'none';
            }
        });

        // دوال الإدارة الخاصة بك (كما هي)
        let savedAccounts = [];
        function importAccounts() {
            const input = document.getElementById('bulkInput').value;
            const lines = input.split('\n');
            lines.forEach(line => {
                let parts = line.split(/\t|\s{2,}/);
                if (parts.length >= 5) {
                    savedAccounts.push({ email: parts[0], password: parts[1], secret: parts[4] });
                }
            });
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            document.getElementById('stats').innerText = savedAccounts.length;
            savedAccounts.forEach((acc, i) => {
                container.innerHTML += `<div class="account-card"><p>${acc.email}</p></div>`;
            });
        }
    </script>
</body>
</html>
