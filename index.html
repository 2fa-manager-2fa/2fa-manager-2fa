<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- هذه الوسوم هي السر في ظهور موقعك في جوجل -->
    <title>مدير المصادقة الثنائية | 2FA Cloud Manager</title>
    <meta name="description" content="أفضل موقع لإدارة وعرض رموز المصادقة الثنائية 2FA وحفظ حساباتك وسحب أكواد الاسترداد بأمان تام في السحابة.">
    <meta name="keywords" content="المصادقة الثنائية, 2fa, توليد رموز 2fa, حماية الحسابات, تو اف ايه, كود الاسترداد">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #090b14; --panel-bg: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; --text-muted: #8b9bb4; --primary: #00f0ff; --secondary: #7000ff;
            --success: #00ff88; --warning: #ffaa00; --danger: #ff3366; --card-bg: rgba(0, 0, 0, 0.3); --shadow: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        
        #authSection { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        #appSection { display: none; }

        .auth-card { background: var(--panel-bg); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px var(--shadow); text-align: center; }
        .auth-card h2 { margin-bottom: 20px; color: var(--primary); }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(128,128,128,0.1); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px; outline: none; }
        
        .btn-auth { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 15px; }
        .btn-google { background: #fff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; }
        .divider { margin: 12px 0; color: var(--text-muted); font-size: 13px; }
        #authError { color: var(--danger); font-size: 13px; min-height: 20px; margin-bottom: 10px; }
        #recaptcha-container { display: flex; justify-content: center; margin-bottom: 10px; }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .btn-nav { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .timer-panel { flex-grow: 1; background: var(--panel-bg); border: 1px solid var(--border); padding: 8px; border-radius: 12px; text-align: center; min-width: 180px; }
        .timer-container { width: 100%; background: rgba(128,128,128,0.2); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 1s linear; }

        .glass-panel { background: var(--panel-bg); border: 1px solid var(--border); padding: 15px; border-radius: 16px; margin-bottom: 15px; }
        .section-label { color: var(--primary); font-size: 15px; margin-bottom: 10px; font-weight: bold; }
        textarea, input[type="text"] { width: 100%; padding: 12px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px; outline: none; font-family: monospace; font-size: 13px; }
        .btn-add { width: 100%; margin-top: 8px; padding: 12px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .search-box { margin-bottom: 15px; }
        .accounts-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .account-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .acc-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 13px; }
        .acc-email { font-weight: bold; direction: ltr; word-break: break-all; color: var(--primary); }
        .acc-details { font-size: 12px; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 5px; direction: ltr; text-align: left; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
        .acc-code-display { text-align: center; font-size: 24px; letter-spacing: 5px; font-weight: bold; color: var(--success); font-family: monospace; }
        
        .acc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-btn { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; background: rgba(128,128,128,0.1); color: var(--text-main); }
        .btn-del { border-color: var(--danger); color: var(--danger); grid-column: span 2; }

        .loading-overlay { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; color: white; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loader">جاري المعالجة...</div>

    <div class="container" id="authSection">
        <div class="auth-card">
            <h2>تسجيل الدخول</h2>
            <div id="authError"></div>
            
            <button class="btn-auth btn-google" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.39l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                جوجل
            </button>

            <div class="divider">أو البريد وكلمة السر</div>
            <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn-auth" onclick="loginWithEmail()">دخول / تسجيل</button>

            <div class="divider">أو برقم الموبايل</div>
            <input type="tel" id="phoneNumber" placeholder="+201000000000" style="direction:ltr; text-align:center;">
            <div id="recaptcha-container"></div>
            <button class="btn-auth" id="sendOtpBtn" onclick="sendOTP()">إرسال الكود</button>
            
            <div id="otpBox" style="display:none; margin-top:10px;">
                <input type="text" id="otpCode" placeholder="أدخل كود الـ 6 أرقام" maxlength="6" style="direction:ltr; text-align:center;">
                <button class="btn-auth" onclick="verifyOTP()">تأكيد الكود</button>
            </div>
        </div>
    </div>

    <div class="container" id="appSection">
        <div class="top-nav">
            <h2 style="color: var(--primary);">2FA Cloud</h2>
            <div class="timer-panel">
                <div style="font-size: 12px; font-weight: bold;">تحديث: <span id="timeText" style="color: var(--primary);">30s</span></div>
                <div class="timer-container"><div id="timerBar"></div></div>
            </div>
            <button class="btn-nav" style="color: var(--danger);" onclick="logout()">خروج</button>
        </div>

        <div class="glass-panel">
            <div class="section-label">إضافة حسابات للسحابة</div>
            <textarea id="bulkInput" placeholder="إيميل | باسورد | استرداد | سنة | مفتاح 2FA"></textarea>
            <button class="btn-add" onclick="importAccounts()">حفظ في السحابة</button>
        </div>

        <div class="glass-panel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 بحث بالـ Gmail لعرض التفاصيل والأكواد..." oninput="filterAccounts()">
            </div>
            <div class="section-label">الحسابات المحفوظة (<span id="stats">0</span>)</div>
            <div class="accounts-grid" id="cardsContainer"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwwVvGPCVkR5ekWN7XGs2hwGTQ0eP4Am8",
            authDomain: "fa-manager-59615.firebaseapp.com",
            projectId: "fa-manager-59615",
            storageBucket: "fa-manager-59615.firebasestorage.app",
            messagingSenderId: "38616686936",
            appId: "1:38616686936:web:922eb72e3c1d74a094852d",
            measurementId: "G-ZSYGL6NQ2P"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        auth.languageCode = 'ar';

        let currentUser = null;
        let savedAccounts = [];
        let confirmationResult = null;

        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'block';
                fetchAccounts();
            } else {
                currentUser = null;
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appSection').style.display = 'none';
            }
        });

        function loginWithGoogle() {
            showLoader(true);
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => { showLoader(false); alert(e.message); });
        }

        function loginWithEmail() {
            const e = document.getElementById('emailInput').value.trim();
            const p = document.getElementById('passInput').value.trim();
            if(!e || !p) return alert("أدخل الإيميل والباسورد");
            showLoader(true);
            auth.signInWithEmailAndPassword(e, p).catch(() => {
                auth.createUserWithEmailAndPassword(e, p).catch(err => { showLoader(false); alert(err.message); });
            });
        }

        function sendOTP() {
            const phone = document.getElementById('phoneNumber').value.trim();
            if(!phone.startsWith('+')) return alert("اكتب الرقم بالكود (مثال: +20)");
            showLoader(true);
            if(!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'normal' });
            }
            auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(res => {
                confirmationResult = res;
                showLoader(false);
                document.getElementById('otpBox').style.display = 'block';
                alert("تم إرسال الكود في رسالة SMS!");
            }).catch(err => { showLoader(false); alert(err.message); });
        }

        function verifyOTP() {
            const code = document.getElementById('otpCode').value.trim();
            showLoader(true);
            confirmationResult.confirm(code).catch(() => { showLoader(false); alert("الكود خطأ"); });
        }

        function logout() { auth.signOut(); }

        async function fetchAccounts() {
            showLoader(true);
            try {
                const snap = await db.collection("users").doc(currentUser.uid).collection("accounts").get();
                savedAccounts = [];
                snap.forEach(doc => savedAccounts.push({ id: doc.id, ...doc.data() }));
                renderCards(savedAccounts);
            } catch(e) {}
            showLoader(false);
        }

        async function importAccounts() {
            const input = document.getElementById('bulkInput').value;
            if(!input.trim()) return;
            showLoader(true);
            for(let line of input.split('\n')) {
                let p = line.trim().split(/\t|\s{2,}/);
                if(p.length >= 5) {
                    let email = p[0].trim();
                    let secret = p[4].toUpperCase().replace(/[^A-Z2-7]/g, '');
                    if(secret.length >= 8) {
                        await db.collection("users").doc(currentUser.uid).collection("accounts").add({
                            email: email, password: p[1].trim(), recovery: p[2].trim(), year: p[3].trim(), secret: secret
                        });
                    }
                }
            }
            document.getElementById('bulkInput').value = '';
            await fetchAccounts();
        }

        function filterAccounts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = savedAccounts.filter(a => a.email.toLowerCase().includes(query));
            renderCards(filtered);
        }

        function renderCards(list) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            document.getElementById('stats').innerText = list.length;
            
            list.forEach((acc) => {
                container.innerHTML += `
                    <div class="account-card">
                        <div class="acc-header">
                            <span class="acc-email">${acc.email}</span>
                            <span>السنة: ${acc.year || '---'}</span>
                        </div>
                        <div class="acc-details">
                            <div><b>Pass:</b> ${acc.password || '---'}</div>
                            <div><b>Recovery:</b> ${acc.recovery || '---'}</div>
                        </div>
                        <div class="acc-code-display" id="code-${acc.id}">--- ---</div>
                        <div class="acc-actions">
                            <button class="action-botton action-btn" onclick="navigator.clipboard.writeText('${acc.email}'); alert('تم نسخ الإيميل');">نسخ الإيميل</button>
                            <button class="action-btn" onclick="navigator.clipboard.writeText('${acc.password}'); alert('تم نسخ الباسورد');">نسخ الباسورد</button>
                            <button class="action-btn btn-del" onclick="deleteAcc('${acc.id}')">مسح الحساب</button>
                        </div>
                    </div>`;
            });
            updateAllCodes(list);
        }

        async function deleteAcc(id) {
            if(confirm('مسح الحساب؟')) {
                showLoader(true);
                await db.collection("users").doc(currentUser.uid).collection("accounts").doc(id).delete();
                await fetchAccounts();
            }
        }

        function base32ToUint8Array(base32) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            for (let i = 0; i < base32.length; i++) {
                let val = alphabet.indexOf(base32.charAt(i));
                if (val === -1) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            let res = new Uint8Array(Math.floor(bits.length / 8));
            for (let i = 0; i < res.length; i++) { res[i] = parseInt(bits.substring(i * 8, i * 8 + 8), 2); }
            return res;
        }

        async function generateTOTP(secret) {
            try {
                const keyBytes = base32ToUint8Array(secret);
                if (keyBytes.length === 0) return "--- ---";
                const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
                const time = Math.floor(Math.floor(Date.now() / 1000) / 30);
                const buffer = new ArrayBuffer(8);
                new DataView(buffer).setUint32(4, time);
                const sign = await crypto.subtle.sign('HMAC', key, buffer);
                const hmac = new Uint8Array(sign);
                const offset = hmac[19] & 0xf;
                const code = ((hmac[offset] & 0x7f) << 24 | (hmac[offset+1] & 0xff) << 16 | (hmac[offset+2] & 0xff) << 8 | (hmac[offset+3] & 0xff)) % 1000000;
                let c = code.toString().padStart(6, '0');
                return c.slice(0, 3) + " " + c.slice(3);
            } catch(e) { return "ERROR"; }
        }

        async function updateAllCodes(list) {
            for (let acc of list) {
                let el = document.getElementById(`code-${acc.id}`);
                if (el) el.innerText = await generateTOTP(acc.secret);
            }
        }

        setInterval(() => {
            const epoch = Math.floor(Date.now() / 1000);
            const timeRemaining = 30 - (epoch % 30);
            document.getElementById('timerBar').style.width = (timeRemaining / 30) * 100 + "%";
            document.getElementById('timeText').innerText = timeRemaining + "s";
            if (timeRemaining === 30) fetchAccounts();
        }, 1000);
    </script>
</body>
</html>
