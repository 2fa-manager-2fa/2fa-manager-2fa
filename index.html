<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحسابات والمصادقة الثنائية 2FA</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-main: #090b14;
            --panel-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #8b9bb4;
            --primary: #00f0ff;
            --secondary: #7000ff;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2, h3 { text-align: center; color: var(--primary); }
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-success { background: var(--success); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
        textarea, input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            box-sizing: border-box;
        }
        .account-card {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid var(--border);
        }
        .backup-codes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
            margin-top: 8px;
        }
        .code-chip {
            background: rgba(0,240,255,0.1);
            border: 1px dashed var(--primary);
            padding: 5px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .code-chip.used {
            background: rgba(255,51,102,0.1);
            border-color: var(--danger);
            color: var(--danger);
            text-decoration: line-through;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>تسجيل الدخول</h2>
        <button class="btn" style="width:100%;" onclick="loginWithGoogle()">تسجيل الدخول باستخدام جوجل</button>
    </div>

    <div class="container" id="app-section" style="display:none;">
        <h2>إدارة الحسابات والأكواد</h2>
        <p style="text-align:center;">المستخدم: <span id="user-email" style="color: var(--success);"></span></p>
        
        <label>أدخل الإيميلات (يقبل المئات دفعة واحدة):</label>
        <textarea id="emails-input" rows="4" placeholder="user1@gmail.com&#10;user2@gmail.com"></textarea>
        <button class="btn" style="width:100%;" onclick="processEmails()">إضافة ومعالجة الحسابات</button>
        
        <hr style="border-color: var(--border); margin: 20px 0;">
        
        <!-- نظام البحث والتصدير -->
        <h3>بحث وتصدير البيانات</h3>
        <input type="text" id="search-input" placeholder="ابحث عن إيميل معين..." onkeyup="filterAccounts()">
        <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="exportToExcel()">تحميل النتائج في ملف إكسل (CSV)</button>
    </div>

    <div class="container" id="results-container" style="display:none;">
        <h3>قائمة الحسابات المُضافة</h3>
        <div id="results-area"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwwVvGPCVkR5ekWN7XGs2hwGTQ0eP4Am8",
            authDomain: "fa-manager-59615.firebaseapp.com",
            projectId: "fa-manager-59615",
            storageBucket: "fa-manager-59615.appspot.com",
            messagingSenderId: "38616686936",
            appId: "1:38616686936:web:922eb72e3c1d74a094852d"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let accountsList = [];

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app-section').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('app-section').style.display = 'none';
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => alert("خطأ: " + error.message));
        }

        function processEmails() {
            const inputVal = document.getElementById('emails-input').value.trim();
            if (!inputVal) {
                alert('الرجاء إدخال إيميل واحد على الأقل!');
                return;
            }

            const emails = inputVal.split(/[\n\s]+/).filter(email => email.includes('@'));
            if (emails.length === 0) {
                alert('صيغة الإيميلات غير صحيحة!');
                return;
            }

            emails.forEach((email) => {
                // منع التكرار لو الإيميل موجود مسبقاً
                if (!accountsList.some(acc => acc.email === email)) {
                    // توليد 8 رموز احتياطية افتراضية
                    let backupCodes = [];
                    for (let i = 0; i < 8; i++) {
                        backupCodes.push({ code: Math.floor(10000000 + Math.random() * 90000000).toString(), used: false });
                    }

                    accountsList.push({
                        email: email,
                        password: "DefaultPassword123",
                        tfa: "JBSWY3DPEHPK3PXP",
                        backupCodes: backupCodes
                    });
                }
            });

            document.getElementById('emails-input').value = '';
            renderAccounts(accountsList);
        }

        function renderAccounts(data) {
            const resultsArea = document.getElementById('results-area');
            const resultsContainer = document.getElementById('results-container');
            resultsArea.innerHTML = '';

            if (data.length > 0) {
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.style.display = 'none';
                return;
            }

            data.forEach((acc, index) => {
                let codesHTML = '';
                acc.backupCodes.forEach((item, cIndex) => {
                    let cssClass = item.used ? 'code-chip used' : 'code-chip';
                    codesHTML += `<div class="${cssClass}" onclick="useCode(${index}, ${cIndex})">${item.code}</div>`;
                });

                const card = document.createElement('div');
                card.className = 'account-card';
                card.id = `acc-card-${index}`;
                card.innerHTML = `
                    <div id="view-mode-${index}">
                        <p><b>البريد:</b> <span class="acc-email">${acc.email}</span></p>
                        <p><b>كلمة السر:</b> ${acc.password}</p>
                        <p><b>المصادقة الثنائية (2FA):</b> ${acc.tfa}</p>
                        <p><b>الرموز الثمانية الاحتياطية (انقر للنسخ مرة واحدة):</b></p>
                        <div class="backup-codes">${codesHTML}</div>
                        <button class="btn btn-warning" style="width:100%; margin-top:10px;" onclick="toggleEdit(${index})">تعديل الحساب</button>
                    </div>
                    <div id="edit-mode-${index}" style="display:none;">
                        <label>تعديل البريد:</label>
                        <input type="text" id="edit-email-${index}" value="${acc.email}">
                        <label>تعديل كلمة السر:</label>
                        <input type="text" id="edit-pass-${index}" value="${acc.password}">
                        <label>تعديل 2FA:</label>
                        <input type="text" id="edit-tfa-${index}" value="${acc.tfa}">
                        <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="saveEdit(${index})">حفظ التعديلات</button>
                    </div>
                `;
                resultsArea.appendChild(card);
            });
        }

        // قفل الكود بحيث لا يتنسخ مرتين
        function useCode(accIndex, codeIndex) {
            let targetCode = accountsList[accIndex].backupCodes[codeIndex];
            if (targetCode.used) {
                alert("عذراً، هذا الكود تم استخدامه مسبقاً ولا يمكن نسخه مرة أخرى!");
                return;
            }
            
            navigator.clipboard.writeText(targetCode.code);
            targetCode.used = true;
            renderAccounts(accountsList);
            alert("تم نسخ الكود بنجاح ولن يتم نسخه مرة أخرى!");
        }

        function toggleEdit(index) {
            let viewMode = document.getElementById(`view-mode-${index}`);
            let editMode = document.getElementById(`edit-mode-${index}`);
            if (editMode.style.display === 'none') {
                viewMode.style.display = 'none';
                editMode.style.display = 'block';
            } else {
                viewMode.style.display = 'block';
                editMode.style.display = 'none';
            }
        }

        function saveEdit(index) {
            let newEmail = document.getElementById(`edit-email-${index}`).value;
            let newPass = document.getElementById(`edit-pass-${index}`).value;
            let newTfa = document.getElementById(`edit-tfa-${index}`).value;

            accountsList[index].email = newEmail;
            accountsList[index].password = newPass;
            accountsList[index].tfa = newTfa;

            renderAccounts(accountsList);
            alert("تم حفظ التعديلات بنجاح!");
        }

        function filterAccounts() {
            let query = document.getElementById('search-input').value.toLowerCase();
            let filtered = accountsList.filter(acc => acc.email.toLowerCase().includes(query));
            renderAccounts(filtered);
        }

        function exportToExcel() {
            if (accountsList.length === 0) {
                alert("لا توجد حسابات لتصديرها!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Email,Password,2FA,BackupCodes\n";
            accountsList.forEach(acc => {
                let codesStr = acc.backupCodes.map(c => c.code).join(" | ");
                csvContent += `"${acc.email}","${acc.password}","${acc.tfa}","${codesStr}"\n`;
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "accounts_2fa.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
