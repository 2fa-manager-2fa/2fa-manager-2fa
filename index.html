<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحسابات الشاملة | 2FA Manager</title>
    <style>
        /* المتغيرات الأساسية */
        :root {
            --bg-main: #090b14;
            --panel-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #8b9bb4;
            --primary: #00f0ff;
            --secondary: #7000ff;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff3366;
            --btn-text: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.3);
            --shadow: rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --panel-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --secondary: #4f46e5;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --btn-text: #ffffff;
            --card-bg: #f8fafc;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 800px; }

        /* شريط التحكم والتايمر */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .theme-toggle { background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .timer-panel { flex-grow: 1; background: var(--panel-bg); border: 1px solid var(--border); padding: 10px; border-radius: 12px; text-align: center; min-width: 200px; }
        .timer-container { width: 100%; background: rgba(128,128,128,0.2); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 1s linear; }

        /* اللوحات */
        .glass-panel { background: var(--panel-bg); border: 1px solid var(--border); padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px var(--shadow); margin-bottom: 20px; }
        .section-label { color: var(--primary); font-size: 15px; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }

        textarea { width: 100%; height: 120px; padding: 15px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; font-size: 13px; outline: none; resize: vertical; font-family: monospace; direction: ltr; }
        textarea:focus, input:focus { border-color: var(--primary); }

        .btn-add { width: 100%; margin-top: 10px; padding: 15px; font-size: 16px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: var(--btn-text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* تصميم البطاقات */
        .accounts-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .account-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px var(--shadow); }
        .acc-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .acc-email { font-size: 15px; font-weight: bold; font-family: sans-serif; direction: ltr; text-align: left; word-break: break-all; }
        .acc-year { background: rgba(128,128,128,0.2); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; color: var(--text-muted); }
        .acc-code-display { text-align: center; font-size: 28px; letter-spacing: 6px; font-weight: bold; color: var(--success); font-family: monospace; padding: 10px 0; }

        /* أزرار الإجراءات السريعة */
        .acc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; background: rgba(128,128,128,0.1); color: var(--text-main); display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.95); }
        
        .btn-copy-code { border-color: var(--success); color: var(--success); }
        .btn-copy-code:hover { background: var(--success); color: #000; }
        .btn-copy-pass { border-color: var(--text-muted); }
        .btn-copy-backup { border-color: var(--primary); color: var(--primary); grid-column: span 2; }
        .btn-edit { border-color: var(--warning); color: var(--warning); }
        .btn-edit:hover { background: var(--warning); color: #000; }
        .btn-del { border-color: var(--danger); color: var(--danger); }
        .btn-del:hover { background: var(--danger); color: white; }
        .btn-disabled { opacity: 0.5; pointer-events: none; border-color: var(--text-muted); color: var(--text-muted); }

        /* نافذة التعديل (Modal) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--bg-main); border: 1px solid var(--primary); padding: 20px; border-radius: 16px;
            width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .modal-header { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 10px; background: rgba(128,128,128,0.1); border: 1px solid var(--border); 
            color: var(--text-main); border-radius: 8px; font-size: 14px; outline: none; direction: ltr; font-family: monospace;
        }
        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-save { background: var(--success); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="top-nav">
            <h2 style="font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">2FA Session</h2>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>

        <div class="timer-panel">
            <div style="font-size: 13px; font-weight: bold;">تحديث الكود خلال: <span id="timeText" style="color: var(--primary);">30s</span></div>
            <div class="timer-container"><div id="timerBar"></div></div>
        </div>

        <div class="glass-panel" style="margin-top: 15px;">
            <div class="section-label">إضافة الحسابات (لصق مجمع)</div>
            <div style="font-size: 11px; color: var(--danger); margin-bottom: 10px;">⚠️ تنبيه: البيانات تُحفظ مؤقتاً وستُحذف فور إغلاق الصفحة.</div>
            <textarea id="bulkInput" placeholder="الترتيب:
1. الجيميل
2. الباسورد
3. بريد الاسترداد
4. السنة
5. مفتاح 2FA
6. الرموز الاحتياطية"></textarea>
            <button class="btn-add" onclick="importAccounts()">إضافة الحسابات واستخراج البيانات</button>
            <div id="importMsg" style="margin-top: 10px; text-align: center; font-weight: bold; font-size: 14px;"></div>
        </div>

        <div class="glass-panel">
            <div class="section-label">
                <span>الحسابات الحالية (<span id="stats">0</span>)</span>
                <button class="btn-danger" onclick="clearAll()">مسح الشاشة</button>
            </div>
            
            <div class="accounts-grid" id="cardsContainer">
                <!-- البطاقات -->
            </div>
        </div>
    </div>

    <!-- نافذة التعديل (Modal) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">✏️ تعديل بيانات الحساب</div>
            <div class="form-group"><label>الجيميل</label><input type="text" id="editEmail"></div>
            <div class="form-group"><label>الباسورد</label><input type="text" id="editPass"></div>
            <div class="form-group"><label>بريد الاسترداد</label><input type="text" id="editRec"></div>
            <div class="form-group"><label>السنة</label><input type="text" id="editYear"></div>
            <div class="form-group"><label>مفتاح المصادقة (Secret)</label><input type="text" id="editSecret"></div>
            <div class="form-group">
                <label>الرموز الاحتياطية (كل رمز في سطر)</label>
                <textarea id="editBackups" style="height: 100px;"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="saveEdit()">حفظ التعديلات</button>
                <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الوضع الليلي/النهاري
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('themeBtn').innerText = '☀️';
        }
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                btn.innerText = '🌙';
            } else {
                body.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                btn.innerText = '☀️';
            }
        }

        // خوارزمية TOTP
        function base32ToUint8Array(base32) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            for (let i = 0; i < base32.length; i++) {
                let val = alphabet.indexOf(base32.charAt(i));
                if (val === -1) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            let res = new Uint8Array(Math.floor(bits.length / 8));
            for (let i = 0; i < res.length; i++) {
                res[i] = parseInt(bits.substring(i * 8, i * 8 + 8), 2);
            }
            return res;
        }

        async function generateTOTP(secretBase32) {
            try {
                const keyBytes = base32ToUint8Array(secretBase32);
                if (keyBytes.length === 0) return "--- ---";
                const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
                const epoch = Math.floor(Date.now() / 1000);
                const time = Math.floor(epoch / 30);
                const timeBuffer = new ArrayBuffer(8);
                new DataView(timeBuffer).setUint32(4, time);
                const signature = await crypto.subtle.sign('HMAC', key, timeBuffer);
                const hmac = new Uint8Array(signature);
                const offset = hmac[19] & 0xf;
                const code = ((hmac[offset] & 0x7f) << 24 | (hmac[offset+1] & 0xff) << 16 | (hmac[offset+2] & 0xff) << 8 | (hmac[offset+3] & 0xff)) % 1000000;
                let c = code.toString().padStart(6, '0');
                return c.slice(0, 3) + " " + c.slice(3);
            } catch(e) { return "ERROR"; }
        }

        // الحسابات
        let savedAccounts = [];
        let currentEditIndex = -1;

        function importAccounts() {
            const input = document.getElementById('bulkInput').value;
            const msg = document.getElementById('importMsg');
            if (!input.trim()) return;

            const lines = input.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                let parts = line.trim().split(/\t|\s{2,}/);
                if (parts.length >= 5) {
                    let email = parts[0].trim();
                    let password = parts[1].trim();
                    let recovery = parts[2].trim(); // حفظ إيميل الاسترداد
                    let year = parts[3].trim();
                    let secret = parts[4].toUpperCase().replace(/[^A-Z2-7]/g, '');
                    
                    let backups = [];
                    for(let i = 5; i < parts.length; i++) {
                        let bk = parts[i].trim();
                        if(bk.length >= 7) backups.push(bk);
                    }

                    if (secret.length >= 8 && !savedAccounts.find(a => a.email === email)) {
                        savedAccounts.push({ email, password, recovery, year, secret, backups });
                        addedCount++;
                    }
                }
            });

            if(addedCount > 0) {
                msg.style.color = 'var(--success)';
                msg.innerText = `تمت إضافة ${addedCount} حساب بنجاح في هذه الجلسة!`;
                document.getElementById('bulkInput').value = '';
                renderCards();
            } else {
                msg.style.color = 'var(--danger)';
                msg.innerText = 'تأكد من الترتيب: إيميل، باسورد، استرداد، سنة، مفتاح.';
            }
            setTimeout(() => msg.innerText = '', 4000);
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            document.getElementById('stats').innerText = savedAccounts.length;

            savedAccounts.forEach((acc, i) => {
                let backupCount = acc.backups ? acc.backups.length : 0;
                let backupBtnClass = backupCount > 0 ? 'btn-copy-backup' : 'btn-disabled';
                let backupBtnText = backupCount > 0 ? `🛡️ رمز احتياطي (${backupCount})` : '❌ نفذت الرموز';

                let cardHTML = `
                    <div class="account-card">
                        <div class="acc-header">
                            <span class="acc-email">${acc.email}</span>
                            <span class="acc-year">${acc.year || '----'}</span>
                        </div>
                        <div class="acc-code-display" id="code-${i}">--- ---</div>
                        <div class="acc-actions">
                            <button class="action-btn btn-copy-code" id="btn-2fa-${i}" onclick="copyLiveCode(${i})">📋 انسخ الكود</button>
                            <button class="action-btn btn-copy-pass" id="btn-pass-${i}" onclick="copyPassword(${i})">🔑 الباسورد</button>
                            <button class="action-btn ${backupBtnClass}" id="btn-backup-${i}" onclick="copySingleBackup(${i})">${backupBtnText}</button>
                            <button class="action-btn btn-edit" onclick="openEditModal(${i})">✏️ تعديل</button>
                            <button class="action-btn btn-del" onclick="deleteAcc(${i})">🗑️ مسح</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
            updateAllCodes();
        }

        async function updateAllCodes() {
            for (let i = 0; i < savedAccounts.length; i++) {
                let el = document.getElementById(`code-${i}`);
                if (el) el.innerText = await generateTOTP(savedAccounts[i].secret);
            }
        }

        // --- نظام التعديل (Edit Modal) ---
        function openEditModal(index) {
            currentEditIndex = index;
            let acc = savedAccounts[index];
            
            // تعبئة البيانات في النافذة المنبثقة
            document.getElementById('editEmail').value = acc.email || '';
            document.getElementById('editPass').value = acc.password || '';
            document.getElementById('editRec').value = acc.recovery || '';
            document.getElementById('editYear').value = acc.year || '';
            document.getElementById('editSecret').value = acc.secret || '';
            
            // تحويل مصفوفة الرموز الاحتياطية لنص (كل رمز في سطر)
            document.getElementById('editBackups').value = (acc.backups || []).join('\n');
            
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            if (currentEditIndex === -1) return;
            
            let email = document.getElementById('editEmail').value.trim();
            let password = document.getElementById('editPass').value.trim();
            let recovery = document.getElementById('editRec').value.trim();
            let year = document.getElementById('editYear').value.trim();
            let secret = document.getElementById('editSecret').value.toUpperCase().replace(/[^A-Z2-7]/g, '');
            
            // استخراج الرموز من مربع النص وتحويلها لمصفوفة مرة أخرى
            let backupsRaw = document.getElementById('editBackups').value.split('\n');
            let backups = backupsRaw.map(b => b.trim()).filter(b => b.length >= 7);

            // تحديث الحساب في الذاكرة
            savedAccounts[currentEditIndex] = { email, password, recovery, year, secret, backups };
            
            closeEditModal();
            renderCards(); // إعادة رسم البطاقات بالتحديثات الجديدة
        }

        // --- دوال النسخ والحذف ---
        function copyTextWithFeedback(text, btnId, originalHTML, successColor) {
            navigator.clipboard.writeText(text).then(() => {
                let btn = document.getElementById(btnId);
                btn.style.background = successColor;
                btn.style.color = "#000";
                btn.innerText = "✔ تم النسخ";
                setTimeout(() => {
                    btn.style.background = "";
                    btn.style.color = "";
                    btn.innerHTML = originalHTML;
                }, 1500);
            });
        }

        function copyLiveCode(index) {
            let el = document.getElementById(`code-${index}`);
            if(el) {
                let codeText = el.innerText.replace(/\s+/g, '');
                if (codeText && !isNaN(codeText)) {
                    copyTextWithFeedback(codeText, `btn-2fa-${index}`, '📋 انسخ الكود', 'var(--success)');
                }
            }
        }

        function copyPassword(index) {
            let pass = savedAccounts[index].password;
            if(pass) copyTextWithFeedback(pass, `btn-pass-${index}`, '🔑 الباسورد', 'var(--text-main)');
        }

        function copySingleBackup(index) {
            let acc = savedAccounts[index];
            if (!acc.backups || acc.backups.length === 0) return;

            let currentCode = acc.backups.shift(); 
            navigator.clipboard.writeText(currentCode).then(() => {
                let btn = document.getElementById(`btn-backup-${index}`);
                btn.style.background = "var(--primary)";
                btn.style.color = "#000";
                btn.innerText = `✔ ${currentCode}`;
                
                setTimeout(() => {
                    let count = acc.backups.length;
                    if (count > 0) {
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.className = "action-btn btn-copy-backup";
                        btn.innerHTML = `🛡️ رمز احتياطي (${count})`;
                    } else {
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.className = "action-btn btn-disabled";
                        btn.innerHTML = '❌ نفذت الرموز';
                    }
                }, 2000);
            });
        }

        function deleteAcc(index) {
            savedAccounts.splice(index, 1);
            renderCards();
        }

        function clearAll() {
            savedAccounts = [];
            renderCards();
        }

        // المؤقت
        setInterval(() => {
            const epoch = Math.floor(Date.now() / 1000);
            const timeRemaining = 30 - (epoch % 30);
            document.getElementById('timerBar').style.width = (timeRemaining / 30) * 100 + "%";
            document.getElementById('timeText').innerText = timeRemaining + "s";
            
            if (timeRemaining === 30) updateAllCodes();
        }, 1000);

        renderCards();
    </script>
</body>
</html>
